# cargo-deny: advisories, licenses, banned and duplicate crates, sources. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "warn"
# An advisory that cannot affect this repo: { id = "RUSTSEC-YYYY-NNNN", reason = "why, ticket, date" }
ignore = []

[licenses]
# Permissive licenses only; a new license needs a decision here. Remove entries the tree no longer uses (cargo-deny
# warns about them).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn" # transitive duplicates are common; clean them up deliberately
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
